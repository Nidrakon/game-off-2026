; Aseprite-Sync (Doku 1.8): Welche Aseprite-Dateien automatisch als
; Sprite-Sheet exportiert und in SpriteFrames umgewandelt werden.
; Je Eintrag ein Abschnitt:
;   source = Aseprite-Datei (hier wird gezeichnet)
;   sheet  = exportiertes Sprite-Sheet (PNG); daneben entsteht eine .json
;            mit Bildpositionen, Bilddauern und Tags
;   frames = SpriteFrames-Datei, die die Figur benutzt
;   layers = (optional) nur diese Ebenen exportieren, auch wenn sie beim
;            Speichern ausgeblendet sind. Ohne Angabe: alles, was beim
;            Speichern sichtbar ist (auch Hilfsebenen, zum Testen gewollt)
;   play_once = Animationen, die einmal laufen und auf dem letzten Bild
;            stehen bleiben (alle anderen laufen in Schleife)
; Jeder Tag in Aseprite wird eine Animation (Name klein geschrieben).
; Eigene Arbeitsdatei ausserhalb des Projekts: in data/aseprite_sync.local.cfg
; (nicht im Repo) im selben Abschnitt "source" mit dem vollen Pfad setzen.
; Sie wird dann bei jedem Export nach "source" unten ins Projekt kopiert.

[professor]
source="res://graphics/source/professor.aseprite"
sheet="res://graphics/sprites/professor/professor_sheet.png"
frames="res://graphics/sprites/professor/professor_sprite_frames.tres"

